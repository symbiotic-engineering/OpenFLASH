# OpenFLASH from the main branch, for running the analysis notebooks against
# it and comparing with this branch's package/src. uv.lock pins the commit;
# move it forward with `uv lock --upgrade-package open-flash`.
[project]
name = "openflash-on-main"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "open-flash",
    "capytaine>=2.2,<3.0",
    "ipykernel",
    "papermill",
    "pandas<3.0",
    "seaborn",
    "sealab",
]

[tool.uv]
package = false

[tool.uv.sources]
# capytaine has no Linux aarch64 wheels on PyPI, and its sdist doesn't
# build there (it links libquadmath, which aarch64 GCC lacks), so take
# wheels built with that fixed from a release on a fork
capytaine = [
    { url = "https://github.com/petebachant/capytaine/releases/download/v2.3.1-aarch64/capytaine-2.3.1-cp312-cp312-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'" },
]
open-flash = { git = "https://github.com/symbiotic-engineering/OpenFLASH", branch = "main" }
# TODO: Point at symbiotic-engineering/sea-lab-utils once it's packaged there
sealab = { git = "https://github.com/petebachant/sea-lab-utils", branch = "python-package" }
